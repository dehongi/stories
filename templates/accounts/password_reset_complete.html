{% extends 'base.html' %}
{% block title %}
  Password Reset Complete - Story Platform
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4 p-md-5 text-center">
          <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
          </div>
          <h3 class="mb-3">Password Reset Complete</h3>
          <p class="mb-4">Your password has been successfully reset. You can now use your new password to log in to your account.</p>
          <div class="d-grid">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
